[project]
name = "butterbackup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "butter-backup",
    "shell-interface",
    "storage-device-managers",
]

[dependency-groups]
dev = [
    "hypothesis>=6.163.0",
    "mypy>=2.1.0",
    "pdbpp>=0.12.1",
    "pydantic>=2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
    "tomli-w>=1.2.0",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv.workspace]
members = ["projects/*"]

[tool.uv.sources]
butter-backup = { workspace = true }
shell-interface = { workspace = true }
storage-device-managers = { workspace = true }

[tool.mypy]
plugins = [
  "pydantic.mypy"
]
allow_any_unimported = false
warn_unreachable = true
enable_error_code = [
    "possibly-undefined"
]
strict = true
files = [
    "projects/butter-backup/src",
    "projects/butter-backup/tests",
    "projects/shell-interface/src",
    "projects/shell-interface/tests",
    "projects/storage-device-managers/src",
    "projects/storage-device-managers/tests",
]

[[tool.mypy.overrides]]
module = "tests.*"
allow_incomplete_defs = true
allow_untyped_defs = true
disable_error_code = [
    "possibly-undefined"
]

[tool.pytest.ini_options]
addopts = [
    "--cov", "src",
    "--cov-branch",
    "--cov-fail-under", "85"
]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C",
    "E",
    "F",
    "FURB",
    "I",
    "ISC",
    "PIE",
    "PL",
    "Q",
    "RUF",
    "SIM",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = ["E501"]
mccabe.max-complexity = 6
